<div class="rs-brand-item">
  <div class="rs-brand-thumb">
    {% if logo.link_url %}
    <a
      class="rs-base-partners-link"
      href="{{ logo.link_url }}"
      target="_blank"
      rel="noopener noreferrer"
    >
      <img src="{{ logo.image.url }}" alt="{{ logo.title|default:'' }}">
    </a>
    {% else %}
    <div class="rs-base-partners-link">
      <img src="{{ logo.image.url }}" alt="{{ logo.title|default:'' }}">
    </div>
    {% endif %}
  </div>
</div>
